name: video-sharing-platform

# 所有运行时镜像默认通过国内镜像代理拉取；国内网络下无需配置 Docker daemon 镜像加速。
# 在根目录 .env 中设置 DOCKER_REGISTRY=docker.io 即可回退官方镜像。

services:
  mysql:
    image: ${DOCKER_REGISTRY:-docker.m.daocloud.io}/library/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_platform}
      MYSQL_USER: ${MYSQL_USER:-video}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: ${DOCKER_REGISTRY:-docker.m.daocloud.io}/library/redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ${DOCKER_REGISTRY:-docker.m.daocloud.io}/minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  rocketmq-nameserver:
    image: ${DOCKER_REGISTRY:-docker.m.daocloud.io}/apache/rocketmq:5.3.3
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx256m

  rocketmq-broker:
    image: ${DOCKER_REGISTRY:-docker.m.daocloud.io}/apache/rocketmq:5.3.3
    restart: unless-stopped
    command: sh mqbroker -n rocketmq-nameserver:9876
    environment:
      JAVA_OPT_EXT: -Xms512m -Xmx512m
    depends_on:
      - rocketmq-nameserver
    volumes:
      - rocketmq_data:/home/rocketmq/store

  backend:
    build:
      context: ./backend
      args:
        # 构建期基础镜像（默认国内代理源，可在 .env 覆盖回官方镜像）
        MAVEN_IMAGE: ${MAVEN_IMAGE:-docker.m.daocloud.io/library/maven:3.9.11-eclipse-temurin-21-alpine}
        JRE_IMAGE: ${JRE_IMAGE:-docker.m.daocloud.io/library/eclipse-temurin:21-jre-alpine}
        # 构建期依赖源（留空回退 Maven Central）
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://maven.aliyun.com/repository/public}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 只有 nginx 作为入口，登录限流必须信任代理追加的 X-Forwarded-For，否则所有用户共用一个 IP 预算。
      AUTH_TRUST_PROXY_HEADERS: ${AUTH_TRUST_PROXY_HEADERS:-true}
      AUTH_SECURE_COOKIE: ${AUTH_SECURE_COOKIE:-false}
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-video_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USER: ${MYSQL_USER:-video}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_BUCKET: video-platform
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64}
      DATA_ENCRYPTION_KEY_BASE64: ${DATA_ENCRYPTION_KEY_BASE64}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
        # 构建期 npm 源（npmmirror 为阿里云公共 npm 镜像）
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        VITE_USE_MOCK: "false"
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  minio_data:
  rocketmq_data:
