map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # 必须与后端 spring.servlet.multipart.max-request-size 对齐（60MB）。
  # 后端的业务上限由私信附件决定（视频 50MB），此前这里只有 10m，
  # 导致 >10MB 的私信附件在 nginx 层就被 413 拒绝，永远到不了后端。
  client_max_body_size 60m;
  # script-src 不再放开 'unsafe-inline'：首屏主题预置已移到同源静态文件
  # public/theme-init.js（阻塞式经典脚本，仍在首次绘制前执行），因此无需为内联脚本开口子。
  # 注：JsonLd 组件输出的 <script type="application/ld+json"> 是数据块而非可执行脚本，
  # 按规范不受 script-src 约束，无需额外放行。
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss: ws:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
