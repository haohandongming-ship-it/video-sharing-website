spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
# 生产环境默认关闭 OpenAPI 文档，避免暴露内部接口结构；需要时用 SPRINGDOC_ENABLED=true 打开。
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

app:
  auth:
    secure-cookie: true
  storage:
    mode: minio
    endpoint: ${MINIO_ENDPOINT}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT}
    access-key: ${MINIO_USER}
    secret-key: ${MINIO_PASSWORD}
    bucket: ${MINIO_BUCKET:video-platform}
