spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    default: dev
  application:
    name: video-platform

  # Java 21 虚拟线程：请求处理从「线程池 + 排队」变成「一请求一虚拟线程」，
  # 对以 JDBC/MinIO 阻塞 IO 为主的接口可以显著提高并发吞吐。
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:video_platform;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: video-platform-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 10000
      validation-timeout: 3000
      max-lifetime: 1740000
      keepalive-time: 300000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  compression:
    enabled: true
    # 实测动态/评论等列表响应在 0.9~1KB 区间，阈值下调到 512B 让它们也走 gzip
    min-response-size: 512
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
  tomcat:
    max-connections: 10000
    accept-count: 200
    connection-timeout: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    # Override with CORS_ALLOWED_ORIGIN_PATTERNS in a deployed environment.
    # Patterns cover the private IPv4 ranges commonly assigned to a LAN client.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://10.*:5173,http://172.16.*:5173,http://172.17.*:5173,http://172.18.*:5173,http://172.19.*:5173,http://172.20.*:5173,http://172.21.*:5173,http://172.22.*:5173,http://172.23.*:5173,http://172.24.*:5173,http://172.25.*:5173,http://172.26.*:5173,http://172.27.*:5173,http://172.28.*:5173,http://172.29.*:5173,http://172.30.*:5173,http://172.31.*:5173,http://192.168.*:5173}
  security:
    data-key-base64: ${DATA_ENCRYPTION_KEY_BASE64:}
  auth:
    issuer: ${JWT_ISSUER:video-platform}
    audience: ${JWT_AUDIENCE:video-web}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 604800
    secure-cookie: ${AUTH_SECURE_COOKIE:false}
    # 反代（nginx/compose）后面 socket 地址是代理地址，置 true 时按 X-Forwarded-For 最右侧一跳识别客户端。
    trust-proxy-headers: ${AUTH_TRUST_PROXY_HEADERS:false}
    private-key-base64: ${JWT_PRIVATE_KEY_BASE64:}
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}
  storage:
    mode: ${STORAGE_MODE:local}
    local-root: ${STORAGE_LOCAL_ROOT:./data}
    # 留空时返回相对上传地址，局域网客户端会通过前端反代访问当前服务器，避免误连客户端 localhost。
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    signing-secret: ${STORAGE_SIGNING_SECRET:}
