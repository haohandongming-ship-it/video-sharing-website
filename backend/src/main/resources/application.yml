spring:
  application:
    name: video-platform
  datasource:
    url: jdbc:h2:mem:video_platform;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  auth:
    issuer: ${JWT_ISSUER:video-platform}
    audience: ${JWT_AUDIENCE:video-web}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 604800
    secure-cookie: ${AUTH_SECURE_COOKIE:false}

