spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: dev
  application:
    name: video-platform
  datasource:
    url: jdbc:h2:mem:video_platform;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  cors:
    # Override with CORS_ALLOWED_ORIGIN_PATTERNS in a deployed environment.
    # Patterns cover the private IPv4 ranges commonly assigned to a LAN client.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://10.*:5173,http://172.16.*:5173,http://172.17.*:5173,http://172.18.*:5173,http://172.19.*:5173,http://172.20.*:5173,http://172.21.*:5173,http://172.22.*:5173,http://172.23.*:5173,http://172.24.*:5173,http://172.25.*:5173,http://172.26.*:5173,http://172.27.*:5173,http://172.28.*:5173,http://172.29.*:5173,http://172.30.*:5173,http://172.31.*:5173,http://192.168.*:5173}
  security:
    data-key-base64: ${DATA_ENCRYPTION_KEY_BASE64:}
  auth:
    issuer: ${JWT_ISSUER:video-platform}
    audience: ${JWT_AUDIENCE:video-web}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 604800
    secure-cookie: ${AUTH_SECURE_COOKIE:false}
    private-key-base64: ${JWT_PRIVATE_KEY_BASE64:}
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}
  storage:
    mode: ${STORAGE_MODE:local}
    local-root: ${STORAGE_LOCAL_ROOT:./data}
    # 留空时返回相对上传地址，局域网客户端会通过前端反代访问当前服务器，避免误连客户端 localhost。
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    signing-secret: ${STORAGE_SIGNING_SECRET:}
