spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    # 默认落在 prod：忘记设置 profile 时应当「启动失败」而不是「静默跑在开发配置上」。
    # prod 需要 MySQL / Redis / MinIO / JWT 等环境变量，缺失即启动报错，属于期望的 fail-fast。
    # 本地开发请显式指定 profile（推荐 scripts/start-backend.ps1，它默认注入 dev-infra）：
    #   mvn spring-boot:run -Dspring-boot.run.profiles=dev
    default: prod
  application:
    name: video-platform

  mvc:
    formcontent:
      filter:
        # 本应用不使用表单提交（请求体一律是 JSON 或 multipart），但 FormContentFilter 默认开启，
        # 会在 DispatcherServlet 之前抢先按 x-www-form-urlencoded 解析 PUT/PATCH/DELETE 的请求体。
        # 分片上传的二进制体因此抛出 HttpMessageNotReadableException —— 该异常发生在 MVC 层之外，
        # 不经过 @RestControllerAdvice，最终返回 Spring 默认错误体而非项目统一信封。关闭它以消除。
        enabled: false

  # Java 21 虚拟线程：请求处理从「线程池 + 排队」变成「一请求一虚拟线程」，
  # 对以 JDBC/MinIO 阻塞 IO 为主的接口可以显著提高并发吞吐。
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:video_platform;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: video-platform-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 10000
      validation-timeout: 3000
      max-lifetime: 1740000
      keepalive-time: 300000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  lifecycle:
    timeout-per-shutdown-phase: 20s

  servlet:
    multipart:
      # 上限由私信附件决定（视频 50MB）。容器层仍留余量并高于业务校验，
      # 超限时返回的是业务自己的中文提示，而不是框架异常。
      # 各类型的具体上限在服务层校验：头像 2MB、封面 4MB、私信图片 5MB、私信视频 50MB。
      max-file-size: 52MB
      max-request-size: 60MB

server:
  shutdown: graceful
  compression:
    enabled: true
    # 实测动态/评论等列表响应在 0.9~1KB 区间，阈值下调到 512B 让它们也走 gzip
    min-response-size: 512
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
  tomcat:
    max-connections: 10000
    accept-count: 200
    connection-timeout: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    # SEC-08：生产环境必须显式配置允许来源，严禁使用通配符或私网范围。
    # 默认仅允许本地开发地址；部署时通过 CORS_ALLOWED_ORIGIN_PATTERNS 覆盖。
    # dev / dev-infra profile 会自动扩展为局域网范围（见 application-dev.yml）。
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    data-key-base64: ${DATA_ENCRYPTION_KEY_BASE64:}
  auth:
    issuer: ${JWT_ISSUER:video-platform}
    audience: ${JWT_AUDIENCE:video-web}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 604800
    # SEC-08：当前默认 false，因为大多数本地/局域网部署未启用 TLS。
    # 一旦接入 HTTPS，必须置为 true，否则 Cookie 在传输中明文暴露，可被网络嗅探窃取。
    # 该开关与 CORS 来源共同构成「生产环境安全检查清单」的前两项。
    secure-cookie: ${AUTH_SECURE_COOKIE:false}
    # 反代（nginx/compose）后面 socket 地址是代理地址，置 true 时按 X-Forwarded-For 最右侧一跳识别客户端。
    trust-proxy-headers: ${AUTH_TRUST_PROXY_HEADERS:false}
    # 本地开发便利开关：Redis 不可用时允许用固定验证码 123456 通过短信校验。
    # 默认关闭；**任何对外可达的环境都必须保持 false**，否则等于开放「用 123456 登录任意手机号」。
    allow-fixed-sms-code: ${AUTH_ALLOW_FIXED_SMS_CODE:false}
    private-key-base64: ${JWT_PRIVATE_KEY_BASE64:}
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}
  storage:
    mode: ${STORAGE_MODE:local}
    local-root: ${STORAGE_LOCAL_ROOT:./data}
    # 留空时返回相对上传地址，局域网客户端会通过前端反代访问当前服务器，避免误连客户端 localhost。
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    signing-secret: ${STORAGE_SIGNING_SECRET:}
  # 多码率 HLS 转码产物目录（scripts/transcode-hls.ps1 的输出），由 TranscodeHlsController 提供。
  # 默认相对 backend/ 的上一级：启动脚本用 Push-Location 切到 backend 目录，故 ../data/hls 即仓库根的 data/hls。
  hls:
    root: ${HLS_ROOT:../data/hls}
